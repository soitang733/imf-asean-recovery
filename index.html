<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASEAN-10 Recovery Observatory</title>
    <meta
      name="description"
      content="ASEAN-10 post-COVID recovery analysis using IMF WEO April 2026 data."
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.0/build/stlite.css"
    />
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      #loading {
        height: 100%; display: grid; place-items: center;
        font: 600 18px system-ui, sans-serif; color: #0f766e;
        background: #f8fafc;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="loading">Loading ASEAN Recovery Observatory…</div></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.0/build/stlite.js";

      mount(
        {
          requirements: ["pandas", "plotly", "scikit-learn"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
            "src/__init__.py": { url: "./src/__init__.py" },
            "src/config.py": { url: "./src/config.py" },
            "src/clustering.py": { url: "./src/clustering.py" },
            "src/features.py": { url: "./src/features.py" },
            "data/clean_imf_weo.csv": { url: "./data/clean_imf_weo.csv" },
            "data/country_features.csv": { url: "./data/country_features.csv" },
            "data/metadata.json": { url: "./data/metadata.json" },
            "outputs/data_coverage.csv": { url: "./outputs/data_coverage.csv" },
            "outputs/outliers.csv": { url: "./outputs/outliers.csv" },
            "outputs/candidate_stories.csv": { url: "./outputs/candidate_stories.csv" }
          },
          streamlitConfig: {
            "theme.primaryColor": "#0F766E",
            "theme.backgroundColor": "#FFFFFF",
            "theme.secondaryBackgroundColor": "#F1F5F9",
            "theme.textColor": "#0F172A",
            "client.toolbarMode": "viewer",
            "client.showErrorDetails": false
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
